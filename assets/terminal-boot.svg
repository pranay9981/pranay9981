<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3342"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="328" rx="14" fill="#0a0e14" stroke="url(#panelEdge)" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="40" rx="14" fill="#12161d"/>
  <rect x="1" y="30" width="998" height="11" fill="#12161d"/>

  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="500" y="26" text-anchor="middle" font-size="13" fill="#6b7280">pranay@github&#8202;:&#8202;~$</text>

  <g font-size="17">
    <text x="34" y="80" fill="#39d0ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.25s" fill="freeze"/>$ whoami</text>
    <text x="34" y="110" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.25s" fill="freeze"/>&gt; pranay_bagaria &#8212; ai/ml engineer, full-stack developer</text>

    <text x="34" y="155" fill="#39d0ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.25s" fill="freeze"/>$ cat mission.log</text>
    <text x="34" y="185" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.25s" fill="freeze"/>&gt; shipping ai that solves real problems, not demos</text>

    <text x="34" y="230" fill="#39d0ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.25s" fill="freeze"/>$ ./init --focus=federated-learning,rag,genai</text>
    <text x="34" y="260" fill="#3ef07c" filter="url(#glow)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.25s" fill="freeze"/>&gt; [ok] 3 focus areas loaded &#183; systems nominal</text>

    <text x="34" y="300" fill="#39d0ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.25s" fill="freeze"/>$</text>
    <rect x="52" y="286" width="11" height="17" fill="#39d0ff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" begin="3.0s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
